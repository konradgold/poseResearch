[project]
name = "poseResearch"
version = "0.1.0"
description = "Pose Estimation and Prediction Pipeline"
readme = "README.md"
requires-python = ">=3.8.20"
dependencies = [
    "easydict>=1.13",
    "einops>=0.8.1",
    "human-body-prior>=0.8.5.0",
    "imageio>=2.35.1",
    "ipdb>=0.13.13",
    "neural-net-drawer>=0.0.4",
    "openai>=1.83.0",
    "opencv-python>=4.11.0.86",
    "peft>=0.13.2",
    "pip>=25.0.1",
    "prettytable>=3.11.0",
    "roma>=1.5.2.1",
    "scikit-learn>=1.3.2",
    "smplx>=0.1.28",
    "tensorboardx>=2.6.2.2",
    "torch>=2.5.1",
    "transformers>=4.46.3",
    "ultralytics>=8.3.146",
    "wandb>=0.21.0",
]

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["detectron2", "MotionBERT", "poseResearch", "VideoPose3D"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
# Exclude all directories except the ones we want
exclude = '''
/(
    .github
  | .vscode
  | .venv
  | chatPose
  | configs
  | detectron2
  | MaskAnyone
  | models
  | Motion-Agent
  | MotionBERT
  | pose_estimation
  | PoseGPT
  | VideoPose3D
)/
'''
skip-string-normalization = false

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    ".github",
    ".vscode",
    "chatPose",
    "configs",
    "detectron2",
    "MaskAnyone",
    "models",
    "Motion-Agent",
    "MotionBERT",
    "pose_estimation",
    "PoseGPT",
    "sam2",
    "VideoPose3D",
    "train_custom.py",
]
