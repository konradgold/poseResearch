[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["detectron2", "MotionBERT", "poseResearch", "VideoPose3D"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
# Exclude all directories except the ones we want
exclude = '''
/(
    .github
  | .vscode
  | .venv
  | chatPose
  | configs
  | detectron2
  | MaskAnyone
  | models
  | Motion-Agent
  | MotionBERT
  | pose_estimation
  | PoseGPT
  | VideoPose3D
)/
'''
skip-string-normalization = false

[tool.ruff]
line-length = 88
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    ".github",
    ".vscode",
    "chatPose",
    "configs",
    "detectron2",
    "MaskAnyone",
    "models",
    "Motion-Agent",
    "MotionBERT",
    "pose_estimation",
    "PoseGPT",
    "VideoPose3D",
    "train_custom.py",
]

[tool.uv.workspace]
members = [
    "detectron2",
    "MotionBERT",
    "poseResearch",
    "VideoPose3D",
]
