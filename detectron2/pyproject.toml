[build-system]
requires = ["setuptools>=61.0", "wheel", "torch>=1.8", "torchvision"]
build-backend = "setuptools.build_meta"

[project]
name = "detectron2"
version = "0.1.0"
description = "Detectron2: A PyTorch-based modular object detection library"
requires-python = ">=3.12"
authors = [
    {name = "Meta Research"}
]
dependencies = [
    "Pillow>=7.1",
    "matplotlib",
    "pycocotools>=2.0.2",
    "termcolor>=1.1",
    "yacs>=0.1.8",
    "tabulate",
    "cloudpickle",
    "tqdm>4.29.0",
    "tensorboard",
    "fvcore>=0.1.5,<0.1.6",
    "iopath>=0.1.7,<0.1.10",
    "omegaconf>=2.1,<2.4",
    "hydra-core>=1.1",
    "black",
    "packaging",
]

[project.optional-dependencies]
all = [
    "fairscale",
    "timm",
    "scipy>1.5.1",
    "shapely",
    "pygments>=2.2",
    "psutil",
    "panopticapi @ https://github.com/cocodataset/panopticapi/archive/master.zip"
]

