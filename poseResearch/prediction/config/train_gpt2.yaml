wandb_log: False # disabled by default
wandb_project: 'pose_research'
wandb_run_name: 'gpt2-train'

# these make the total batch size be 7.5k
# 12 batch size * 128 block size * 5 gradaccum * 1 GPUs = 7.680
batch_size: 12
block_size: 128
gradient_accumulation_steps: 5

# model
n_layer: 3
n_head: 4
n_embd: 256
dropout: 0.0 # for pretraining 0 is good, for finetuning try 0.1+
bias: False
vocab_size: 486

# this makes total number of tokens be 300B
max_iters: 600000
lr_decay_iters: 600000

# eval stuff
eval_interval: 1000
eval_iters: 200
log_interval: 10

learning_rate: 6e-4 # max learning rate
weight_decay: 1e-1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0 # clip gradients at this value, or disable if == 0.0
# learning rate decay settings
decay_lr: True # whether to decay the learning rate
warmup_iters: 2000 # how many steps to warm up for
min_lr: 6e-5

out_dir: out
eval_only: False # if True, script exits right after the first eval
always_save_checkpoint: True # if True, always save a checkpoint after each eval
init_from: 'scratch' # 'scratch' or 'resume' or 'gpt2*'
# wandb logging
# data
dataset: 'pose_data'

 # minimum learning rate, should be ~= learning_rate/10 per Chinchilla
# DDP settings
backend = 'nccl' # 'nccl', 'gloo', etc.
# system
compile: True